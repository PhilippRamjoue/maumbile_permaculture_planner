[project]
name = "permaculture-planner-backend"
version = "0.1.0"
description = "Backend API for the Permaculture Planner"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "geoalchemy2>=0.15",
    "alembic>=1.13",
    "shapely>=2.0",
    "structlog>=24.1",
    "argon2-cffi>=25.1.0",
    "pyjwt>=2.15.1",
    "email-validator>=2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "testcontainers[postgres]>=4.7",
    "ruff>=0.5",
    "mypy>=1.10",
]

# No [build-system]: this is an application, not a distributable package.
# uv treats it as a non-packaged project and installs only its dependencies.

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
ignore_missing_imports = true
files = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "app"]
markers = [
    "integration: tests that require a live PostGIS container (Docker)",
]
