log_format maumbile '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/access.log maumbile;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;

    # The public edge must append the real client address. Walk the Docker proxy chain
    # from the right, then replace the forwarding header sent to the backend.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # A plan saves up to 1,000 features in one request, which can exceed nginx's 1 MB default
    # (answered with 413 before the API ever sees it).
    client_max_body_size 10m;

    # The map library makes the JS bundle large; compress it for slow connections.
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Proxy API calls to the backend service (compose service name: backend).
    location /api/ {
        proxy_pass http://backend:8000;
    }

    # Share paths are credentials. Application logs provide redacted diagnostics.
    location /api/v1/shared/ {
        access_log off;
        error_log /dev/null;
        proxy_pass http://backend:8000;
    }
    location /shared/ {
        access_log off;
        error_log /dev/null;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files /index.html =404;
    }
    location = /reset-password {
        access_log off;
        error_log /dev/null;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files /index.html =404;
    }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
    }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # SPA fallback: unknown routes serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
