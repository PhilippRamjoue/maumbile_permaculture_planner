server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # A plan saves up to 1,000 features in one request, which can exceed nginx's 1 MB default
    # (answered with 413 before the API ever sees it).
    client_max_body_size 10m;

    # The map library makes the JS bundle large; compress it for slow connections.
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Proxy API calls to the backend service (compose service name: backend).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: unknown routes serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
