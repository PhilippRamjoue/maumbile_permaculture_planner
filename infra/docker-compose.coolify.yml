# Coolify / no-build deployment: the same lean stack as docker-compose.yml, but the backend and
# frontend are PULLED from GitHub Container Registry (published by .github/workflows/release.yml
# on a v* tag), never built. It is self-contained (no overrides, no `build:` contexts), so it works
# whatever project directory the platform runs it from (the build contexts of
# docker-compose.yml, `../backend`, break when Coolify uses the repo root). See docs/DEPLOY.md.
#
# Required: POSTGRES_PASSWORD (URL-safe) and APP_SECRET_KEY. Recommended: APP_CORS_ORIGINS.
# Optional: MAUMBILE_VERSION (image tag; `latest` by default, or pin e.g. `0.1.0`) and
# MAUMBILE_IMAGE_OWNER (GHCR namespace, lowercase; set it if you publish images from a fork).
# Images are linux/amd64 (the PostGIS database image is amd64 only).
# Keep the service definitions in sync with docker-compose.yml.

name: permaculture-planner

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # Keep URL-safe (letters/digits, e.g. `openssl rand -hex 24`): it is embedded in APP_DATABASE_URL.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD (URL-safe) in Coolify (or a local .env)}
      POSTGRES_DB: ${POSTGRES_DB:-permaculture}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-permaculture}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/${MAUMBILE_IMAGE_OWNER:-philippramjoue}/maumbile-backend:${MAUMBILE_VERSION:-latest}
    pull_policy: always
    restart: unless-stopped
    logging: *default-logging
    environment:
      APP_ENVIRONMENT: production
      APP_DEBUG: ${APP_DEBUG:-false}
      # Boot fails in production if this is unset or the dev default (see app/core/config.py).
      APP_SECRET_KEY: ${APP_SECRET_KEY:?set APP_SECRET_KEY in Coolify (or a local .env)}
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-true}
      # JSON array. The SPA calls /api same-origin through nginx, so [] is enough; list the public
      # origin(s) if anything else needs cross-origin access.
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-[]}
      APP_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-permaculture}
      APP_TERRAIN_CONTOUR_INTERVAL_M: ${APP_TERRAIN_CONTOUR_INTERVAL_M:-5.0}
      # Login attempts per client IP and per email per minute; only disposable test stacks raise it.
      APP_LOGIN_RATE_LIMIT_ATTEMPTS: ${APP_LOGIN_RATE_LIMIT_ATTEMPTS:-10}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    # Release step: apply migrations (additive, idempotent) and only then serve. If the migration
    # fails the container exits, /readyz never passes and the frontend never starts: the deploy
    # fails loudly instead of serving code against a stale schema. --proxy-headers/--forwarded-allow-ips make request.client the real
    # client IP from nginx's X-Forwarded-For (login throttling); safe because port 8000 is not
    # published. Requests are logged as JSON by the app (--no-access-log drops uvicorn's plain-text
    # duplicate). Binaries are called directly (the image is built with `uv sync --frozen`).
    command:
      - sh
      - -c
      - >-
        /app/.venv/bin/alembic upgrade head &&
        exec /app/.venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000
        --proxy-headers --forwarded-allow-ips='*' --no-access-log
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 40s

  frontend:
    image: ghcr.io/${MAUMBILE_IMAGE_OWNER:-philippramjoue}/maumbile-frontend:${MAUMBILE_VERSION:-latest}
    pull_policy: always
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pgdata:
