# Lean v1 stack: db + backend + frontend. Deployed on Coolify from this file
# (see docs/DEPLOY.md). This file is production-shaped:
#   - no host ports are published (Coolify's proxy reaches the frontend on container port 80;
#     the database and API are internal only),
#   - required secrets fail fast when unset,
#   - cookies are Secure by default (HTTPS).
# For local use, add the local override (publishes localhost ports, non-Secure cookies):
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
# Scale-up services (redis, worker) live in docker-compose.scale.yml — see §10 of
# docs/ARCHITECTURE.md. Copy .env.example to .env before `docker compose up`.

name: permaculture-planner

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # Keep URL-safe (letters/digits, e.g. `openssl rand -hex 24`): it is embedded in APP_DATABASE_URL.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD (URL-safe) in infra/.env or Coolify}
      POSTGRES_DB: ${POSTGRES_DB:-permaculture}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-permaculture}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    logging: *default-logging
    environment:
      APP_ENVIRONMENT: production
      APP_DEBUG: ${APP_DEBUG:-false}
      # Boot fails in production if this is unset or the dev default (see app/core/config.py).
      APP_SECRET_KEY: ${APP_SECRET_KEY:?set APP_SECRET_KEY in infra/.env or Coolify}
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-true}
      # JSON array. The SPA calls /api same-origin through nginx, so [] is enough; list the public
      # origin(s) if anything else needs cross-origin access.
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-[]}
      APP_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-permaculture}
      APP_TERRAIN_CONTOUR_INTERVAL_M: ${APP_TERRAIN_CONTOUR_INTERVAL_M:-5.0}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    # Release step: apply migrations (additive, idempotent) and only then serve. If the migration
    # fails the container exits, /readyz never passes and the frontend never starts: the deploy
    # fails loudly instead of serving code against a stale schema. --proxy-headers/--forwarded-allow-ips make request.client the real
    # client IP from nginx's X-Forwarded-For (login throttling); safe because port 8000 is not
    # published. Requests are logged as JSON by the app (--no-access-log drops uvicorn's plain-text
    # duplicate). Binaries are called directly (the image is built with `uv sync --frozen`).
    command:
      - sh
      - -c
      - >-
        /app/.venv/bin/alembic upgrade head &&
        exec /app/.venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000
        --proxy-headers --forwarded-allow-ips='*' --no-access-log
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 40s

  frontend:
    build:
      context: ../frontend
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pgdata:
