# Lean v1 stack: db + backend + frontend. Deployed on Coolify from this file.
# Scale-up services (redis, worker) live in docker-compose.scale.yml — see §10 of
# docs/ARCHITECTURE.md. Copy .env.example to .env before `docker compose up`.

name: permaculture-planner

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-permaculture}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-permaculture}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    environment:
      APP_ENVIRONMENT: production
      APP_SECRET_KEY: ${APP_SECRET_KEY:?set APP_SECRET_KEY in infra/.env}
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-true}
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-["http://localhost:5173","http://localhost:8080"]}
      APP_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-permaculture}
    depends_on:
      db:
        condition: service_healthy
    # Apply migrations on deploy, then serve.
    command: >
      sh -c "uv run --frozen --no-dev alembic upgrade head &&
             uv run --frozen --no-dev uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 30s

  frontend:
    build:
      context: ../frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  pgdata:
