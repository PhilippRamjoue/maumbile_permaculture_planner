name: Release

# Pushing a tag like v0.1.0 builds the backend and frontend images, pushes them to GHCR
# (ghcr.io/<owner>/maumbile-backend and -frontend, tagged with the version and `latest`) and
# creates a GitHub release from the matching CHANGELOG.md section. See docs/RELEASING.md.
# Only the built-in GITHUB_TOKEN is used; no secret is stored in the repository.

on:
  push:
    tags: ["v*"]

jobs:
  check:
    name: Check tag against CHANGELOG
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$version]' section. Add it before tagging."
            exit 1
          fi

  images:
    name: Build and push ${{ matrix.image }}
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: backend
          - image: frontend
            context: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase image name (GHCR requires it)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/maumbile-${{ matrix.image }}" >> "$GITHUB_ENV"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # v1.2.3 -> 1.2.3, 1.2 and (for non-prerelease tags) latest.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0
            org.opencontainers.image.title=Maumbile ${{ matrix.image }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  github-release:
    name: GitHub release
    needs: [check, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v v="${{ needs.check.outputs.version }}" '
            $0 ~ "^## \[" v "\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags=()
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" --title "Maumbile $GITHUB_REF_NAME" \
            --notes-file release-notes.md "${flags[@]}"
