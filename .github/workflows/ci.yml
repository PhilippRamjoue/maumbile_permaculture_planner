name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.26"
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy app
      - name: Frontend API contract drift
        run: uv run python scripts/generate_frontend_contracts.py --check
      - name: Tests (unit + PostGIS integration via Testcontainers)
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    env:
      APP_SECRET_KEY: ci-only-disposable-secret-01234567890123456789
      POSTGRES_PASSWORD: ci-only-disposable-pw
      APP_COOKIE_SECURE: "false"
      # Every spec signs in, all from one runner IP within a minute; the default 10 is too tight.
      APP_LOGIN_RATE_LIMIT_ATTEMPTS: "100"
      E2E: "1"
      E2E_BASE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start disposable stack
        run: docker compose -p permaculture-ci -f infra/docker-compose.yml -f infra/docker-compose.local.yml up --build -d --wait
      - name: Browser acceptance tests
        run: npm run e2e -- --project=chromium
        working-directory: frontend
      - name: Stack logs
        if: failure()
        run: docker compose -p permaculture-ci -f infra/docker-compose.yml -f infra/docker-compose.local.yml logs --no-color
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: frontend/test-results
      - name: Remove disposable stack
        if: always()
        run: docker compose -p permaculture-ci -f infra/docker-compose.yml -f infra/docker-compose.local.yml down -v
