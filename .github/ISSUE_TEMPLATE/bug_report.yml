name: Bug report
description: Something is broken or behaves unexpectedly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping! **Do not include passwords, secrets, your `.env`, or personal data.**
        Security problems: please do not file them here, see [SECURITY.md](https://github.com/PhilippRamjoue/maumbile_permaculture_planner/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open ...\n2. Click ...\n3. See ..."
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where does it happen?
      options:
        - Hosted instance
        - Self-hosted (Docker Compose)
        - Local development
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag or commit (see the image tag, or `git rev-parse --short HEAD`).
      placeholder: v0.1.0
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Firefox 130 on Android 14
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Browser console or backend log lines (remove anything personal). Include the `X-Request-ID` if you have one.
