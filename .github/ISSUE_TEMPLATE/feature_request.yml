name: Feature request
description: Suggest an improvement or a new capability
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation or problem, not only the solution. Who is it for?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: Your idea, and any alternatives you considered.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Region, climate or connectivity constraints, examples, mock-ups. Maumbile is built for beginners and low-bandwidth use, so simple wins.
